openapi: 3.0.3
info:
  title: Office Queue Management API
  version: 0.1.0
  description: >
    Backend API for the Office Queue Management System (SE2 project).
    Sprint 1 covers the "Get ticket" story: a customer selects a service
    type and receives a ticket with a unique wait-list code.
    Data is stored in SQLite; queues restart every morning (POST /api/test/reset).
servers:
  - url: http://localhost:3001
    description: Local development
tags:
  - name: services
  - name: tickets
  - name: counters
  - name: test-utils
paths:
  /api/services:
    get:
      tags: [services]
      summary: List all service types offered by the office
      operationId: getServices
      responses:
        '200':
          description: List of service types
          content:
            application/json:
              schema:
                type: object
                required: [services]
                properties:
                  services:
                    type: array
                    items:
                      $ref: '#/components/schemas/Service'
  /api/tickets:
    post:
      tags: [tickets]
      summary: Issue a new ticket for a service type
      operationId: createTicket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewTicket'
      responses:
        '201':
          description: Ticket created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '400':
          description: Missing or invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown service type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/counters:
    get:
      tags: [counters]
      summary: List the counters and the services each one handles
      operationId: getCounters
      responses:
        '200':
          description: List of counters
          content:
            application/json:
              schema:
                type: object
                required: [counters]
                properties:
                  counters:
                    type: array
                    items:
                      $ref: '#/components/schemas/Counter'
  /api/counters/{id}/next:
    post:
      tags: [counters]
      summary: Call the next customer to a counter
      description: Serves the longest queue of the counter; on a tie, the one with the lowest service time.
      operationId: callNextCustomer
      parameters:
        - name: id
          in: path
          required: true
          description: Numeric counter id
          schema:
            type: integer
            minimum: 1
          example: 2
      responses:
        '200':
          description: Ticket called to the counter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalledTicket'
        '204':
          description: No customers waiting for the services of this counter
        '400':
          description: The counter id is not a positive integer (only digits, no leading zero)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown counter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/test/reset:
    post:
      tags: [test-utils]
      summary: Reset all queues and ticket counters (morning reset)
      description: Available only when NODE_ENV=test. Used by tests to isolate state.
      responses:
        '204':
          description: State cleared
        '403':
          description: Not available outside test environment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Service:
      type: object
      required: [tag, name, serviceTime]
      properties:
        tag:
          type: string
          description: Short identifier of the service type
          example: A
        name:
          type: string
          example: Shipping
        serviceTime:
          type: integer
          description: Average time to serve this request type, in minutes
          example: 5
    NewTicket:
      type: object
      required: [serviceType]
      properties:
        serviceType:
          type: string
          description: Tag of the requested service type
          example: A
    Ticket:
      type: object
      required: [id, code, serviceType, issuedAt, status]
      properties:
        id:
          type: integer
          example: 1
        code:
          type: string
          description: >
            Wait-list code shown to the customer. Zero-padded daily sequence,
            unique for the whole office (queues reset every morning).
          example: '001'
        serviceType:
          type: string
          example: A
        issuedAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [waiting, called, served]
          example: waiting
    Counter:
      type: object
      required: [id, services]
      properties:
        id:
          type: integer
          example: 2
        services:
          type: array
          description: Tags of the service types handled by the counter
          items:
            type: string
          example: [A, B]
    CalledTicket:
      allOf:
        - $ref: '#/components/schemas/Ticket'
        - type: object
          required: [counterId]
          properties:
            status:
              type: string
              enum: [called]
              example: called
            counterId:
              type: integer
              description: Counter the customer must go to
              example: 2
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: serviceType is required
